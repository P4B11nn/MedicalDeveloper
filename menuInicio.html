<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú de Inicio</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: url('img/medical-background.png?v=1') center center / cover no-repeat;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(126, 211, 252, 0.1);
      z-index: -1;
    }
    header {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      color: #1f2937;
      text-align: center;
      padding: 20px;
      position: relative;
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.3);
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }
    header .icon {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 20px;
      cursor: pointer;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      margin: 20px;
      padding: 20px 30px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      margin-top: -10px;
    }
    h2 {
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, #7dd3fc, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      padding: 18px 24px;
      font-size: 16px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      border: 2px solid rgba(125, 211, 252, 0.3);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .menu button:hover {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(125, 211, 252, 0.3);
      border-color: rgba(125, 211, 252, 0.5);
    }
    .menu button span {
      flex: 1;
      text-align: left;
    }
    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
    .buttons {
      margin-top: 15px;
      display: flex;
      justify-content: space-around;
    }
    .buttons button {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      color: #1f2937;
      border: none;
      border-radius: 25px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.2);
    }
    .buttons button:hover {
      background: linear-gradient(135deg, #38bdf8, #fbbf24);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(125, 211, 252, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="icon" id="userIcon" style="cursor:pointer;">👤 <span id="userName" style="font-weight:bold; margin-left:8px;"></span>
      <div id="userDropdown" style="display:none; position:absolute; top:40px; right:0; background:white; color:#333; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15); min-width:180px; z-index:10;">
        <button id="startServiceBtn" style="width:100%; padding:10px; border:none; background:none; cursor:pointer; text-align:left; display:flex; align-items:center;">
          <span style="margin-right:10px;">🟢</span> Iniciar servicio
        </button>
        <button id="verPerfilBtn" style="width:100%; padding:10px; border:none; background:none; cursor:pointer; text-align:left; display:flex; align-items:center;">
          <span style="margin-right:10px;">👤</span> Ver perfil
        </button>
        <button id="logoutBtn" style="width:100%; padding:10px; border:none; background:none; cursor:pointer; text-align:left; display:flex; align-items:center;">
          <span style="margin-right:10px;">🚪</span> Cerrar sesión
        </button>
      </div>
    </div>
    <h1>Medical Developer</h1>
  </header>

  <div class="container">
    <h2>Bienvenido <span id="rolText"></span></h2>

  <div class="menu">
    <button data-category="pacientes">👥 <span>Pacientes</span></button>
    <button data-category="usuarios-personal">👤 <span>Usuarios y Personal</span></button>
    <button data-category="operaciones-control">⚙️ <span>Operaciones / Control</span></button>
    <button data-category="reportes">📊 <span>Reportes</span></button>
  </div>
  </div>

  <!-- Modales -->
  <div id="modalRegistroES" class="modal" style="display:none; position:fixed; z-index:1; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color:#fefefe; margin:10% auto; padding:20px; border:1px solid #888; width:80%; max-width:600px; border-radius:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="margin:0;">Registro de Actividad</h2>
        <span id="cerrarRegistroES" style="cursor:pointer; font-size:22px;">&times;</span>
      </div>
      <div id="registroESLista" style="max-height:350px; overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div id="modalConfirmacion" class="modal" style="display:none; position:fixed; z-index:1; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color:#fefefe; margin:15% auto; padding:20px; border:1px solid #888; width:80%; max-width:400px; border-radius:10px;">
      <h2 id="tituloConfirmacion" style="margin-top:0;">Confirmación</h2>
      <p id="mensajeConfirmacion">¿Está seguro de realizar esta acción?</p>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button id="btnCancelarConfirmacion" style="padding:8px 15px; background:#f2f2f2; border:none; border-radius:5px; cursor:pointer;">Cancelar</button>
        <button id="btnAceptarConfirmacion" style="padding:8px 15px; background:#007bce; color:white; border:none; border-radius:5px; cursor:pointer;">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="js/views/MenuInicio.js"></script>
</body>
</html>
