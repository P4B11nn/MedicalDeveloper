<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Administrativa - Medical Developer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: url('../img/medical-background.png') center center / cover no-repeat;
    }
    
    header {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      color: #1f2937;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.3);
      position: relative; /* Para posicionar correctamente el dropdown */
      z-index: 1001; /* SOLUCIÓN DROPDOWN: z-index elevado */
    }
    
    header h1 {
      margin: 0;
      flex-grow: 1;
      text-align: center;
    }
    
    .back-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 0 10px;
      color: #1f2937;
    }
    
    /* Estilos para dropdown y usuario */
    #userIcon {
      cursor: pointer;
      padding: 0 15px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto; /* Empuja el icono a la derecha */
      min-width: 150px; /* Asegura espacio suficiente para el nombre */
    }
    
    #userIcon:hover {
      opacity: 0.8;
    }
    
    #userDropdown {
      transition: all 0.3s ease;
    }
    
    #startServiceBtn:hover,
    #logoutBtn:hover {
      background-color: #f3f4f6;
      border-radius: 4px;
    }
    
    .main-layout {
      display: flex;
      min-height: calc(100vh - 80px);
    }
    
    .sidebar {
      width: 250px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px;
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.2);
    }
    
    .sidebar h2 {
      margin-top: 0;
      color: #1f2937;
    }
    
    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
    }
    
    .sidebar-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 12px 15px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(125, 211, 252, 0.2);
      border: 1px solid rgba(125, 211, 252, 0.2);
    }
    
    .sidebar-menu button i {
      margin-right: 10px;
      color: #0891b2;
    }
    
    .sidebar-menu button:hover, .sidebar-menu button.active {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(125, 211, 252, 0.3);
    }
    
    .content {
      flex-grow: 1;
      padding: 20px;
    }
    
    .content-area {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.2);
      margin-bottom: 20px;
    }
    
    .form-section {
      display: none;
    }
    
    .form-section.active {
      display: block;
    }
    
    .content-title {
      margin-top: 0;
      color: #0891b2;
      font-size: 1.5em;
      border-bottom: 2px solid rgba(125, 211, 252, 0.3);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: #1f2937;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(125, 211, 252, 0.2);
      display: inline-flex;
      align-items: center;
    }
    
    .btn-primary i {
      margin-right: 8px;
    }
    
    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(125, 211, 252, 0.3);
      transform: translateY(-2px);
    }

    /* Estilos específicos para las secciones */
    #lista-modulos, #lista-grupos {
      margin-top: 20px;
    }
    
    .icon {
      cursor: pointer;
      font-size: 1.2em;
    }
    
    /* Estilos para las tablas de datos */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(125, 211, 252, 0.2);
    }
    
    .data-table th,
    .data-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid rgba(125, 211, 252, 0.2);
    }
    
    .data-table th {
      background: linear-gradient(135deg, #7dd3fc20, #fef3c720);
      color: #0891b2;
      font-weight: 500;
    }
    
    .data-table tr:hover {
      background-color: rgba(125, 211, 252, 0.1);
    }
    
    .data-table tr:last-child td {
      border-bottom: none;
    }
    
    /* Estilos para las acciones en tablas */
    .actions {
      display: flex;
      gap: 5px;
    }
    
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .assign-grupo {
      color: #0891b2;
    }
    
    .edit-modulo, .edit-grupo {
      color: #047857;
    }
    
    .delete-modulo, .delete-grupo {
      color: #b91c1c;
    }
    
    .btn-icon:hover {
      background-color: rgba(0, 0, 0, 0.1);
      transform: scale(1.1);
    }
    
    /* Estilos para badges */
    .badge {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 500;
      display: inline-block;
    }
    
    .badge-success {
      background-color: rgba(4, 120, 87, 0.2);
      color: #047857;
    }
    
    .badge-warning {
      background-color: rgba(245, 158, 11, 0.2);
      color: #d97706;
    }
    
    .badge-info {
      background-color: rgba(8, 145, 178, 0.2);
      color: #0891b2;
    }
    
    .badge-gray {
      background-color: rgba(107, 114, 128, 0.2);
      color: #6b7280;
    }
    
    /* Mensaje vacío */
    .empty-message {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      border: 1px dashed rgba(125, 211, 252, 0.4);
    }
  </style>
  </head>
<body>
  <header>
    <button class="back-btn" onclick="window.location.href='/menuInicio.html'">←</button>
    <h1>Gestión Administrativa</h1>
    <div class="icon" id="userIcon">
      <span id="userName" style="font-weight:bold; margin-right:8px;"></span>👤
      <div id="userDropdown" style="display:none; position:fixed; top:60px; right:10px; background:white; color:#333; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15); min-width:180px; z-index:1000;">
        <button id="startServiceBtn" style="width:100%; padding:10px; border:none; background:none; cursor:pointer; text-align:left;">Iniciar servicio</button>
        <button id="logoutBtn" style="width:100%; padding:10px; border:none; background:none; cursor:pointer; text-align:left;">Cerrar sesión</button>
      </div>
    </div>
  </header>
  <div class="main-layout">
    <div class="sidebar">
      <h2>Administración</h2>
      <ul class="sidebar-menu">
        <li><button data-section="modulos"><i class="fas fa-hospital"></i> Gestionar Módulos</button></li>
        <li><button data-section="grupos"><i class="fas fa-users"></i> Gestionar Grupos</button></li>
      </ul>
    </div>
    <div class="content">
      <div class="content-area">
        <div id="modulos-section" class="form-section"></div>
        <div id="grupos-section" class="form-section"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import { AuthGuard } from '../js/middleware/authGuard.js';
    import { initGlobalController } from '../js/controllers/globalController.js';
    import { initGestionController } from '../js/controllers/gestionController.js';
    import { init as initGestionView } from '../js/views/gestionView.js';
    import '../js/utils/eventBusManager.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Página Gestión Administrativa: Inicializando...');
      
      // Verificar sesión y permisos
      const requiredRoles = ['admin'];
      if (AuthGuard.validateSession(requiredRoles)) {
        console.log('Gestión Administrativa: Acceso permitido');
        
        // Inicializar controladores
        initGlobalController();
        
        // Inicializar vista primero (importante para el event binding)
        initGestionView();
        
        // Luego inicializar controlador
        initGestionController();        
      }
    });
  </script>
</body>
</html>
