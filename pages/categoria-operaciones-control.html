  <script>
    // Protección temprana: si la URL contiene un hash que apunta a una sección
    // de esta página, ocultamos todas las secciones y mostramos sólo la indicada.
    // Además soportamos un modo compacto: si la query string contiene compact=1
    // ocultamos header y sidebar para incrustar esta página en un iframe/pestaña.
    (function(){
      try{
        const url = new URL(window.location.href);
        const params = url.searchParams;
        const compact = params.get('compact') === '1';

        if (compact) {
          // Aplicar clase compact al body para ocultar header/sidebar mediante CSS
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('compact'));
          } else {
            document.body.classList.add('compact');
          }
        }

        let hash = window.location.hash ? window.location.hash.replace(/^#/, '') : null;
        if(hash && hash.endsWith('-section')) hash = hash.replace(/-section$/, '');

        // Si no hay hash pero estamos en modo compacto, forzamos mostrar registro-entradas-salidas
        if (!hash && compact) hash = 'registro-entradas-salidas';

        if(!hash) return;

        // En caso de que el DOM aún no esté listo, esperamos DOMContentLoaded
        const showOnly = ()=>{
          // Ocultar todas las secciones
          document.querySelectorAll('.form-section').forEach(el=>{ el.classList.add('hidden'); el.classList.remove('active'); });

          // Limpiar contenedores para evitar solapamientos visuales
          const registroEl = document.getElementById('registroESLista'); if (registroEl) registroEl.innerHTML = '';
          // Eliminado: se removieron todas las referencias a 'mesasGrid' para evitar conflictos.

          const target = document.getElementById(hash + '-section');
          if(target) {
            target.classList.remove('hidden');
            target.classList.add('active');
          }
        };

        if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showOnly); else showOnly();
      }catch(e){ console.warn('Early section show failed', e); }
    })();
  </script>

  <script>
    // Función para inicializar header individual
    function initIndividualHeader() {
      const userIcon = document.getElementById('userIcon');
      const userDropdown = document.getElementById('userDropdown');
      // logoutOption eliminado - se maneja en userDisplayGlobal.js
      
      // Obtener información del usuario (intentar múltiples fuentes)
      let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      
      // Si currentUser está vacío, intentar con usuarioActual
      if (!currentUser.nombre && !currentUser.name) {
        currentUser = JSON.parse(localStorage.getItem('usuarioActual') || '{}');
      }
      
      // Función para obtener nombre para mostrar con rol
      function getRoleDisplayName(role) {
        switch (role) {
          case 'admin': return 'Administrador';
          case 'practicante': return 'Practicante';  
          case 'supervisor': return 'Supervisor';
          default: return 'Usuario';
        }
      }
      
      // Actualizar información del usuario
      const displayName = currentUser.nombre || currentUser.name || 'Usuario';
      const userRole = currentUser.rol || currentUser.role || 'sin-rol';
      const roleDisplayName = getRoleDisplayName(userRole);
      
      // Actualizar elementos del DOM
      const userNameElement = document.getElementById('userName');
      const dropdownUserName = document.getElementById('dropdownUserName');
      const dropdownUserRole = document.getElementById('dropdownUserRole');
      
      if (userNameElement) {
        userNameElement.textContent = displayName;
      }
      
      if (dropdownUserName) {
        dropdownUserName.textContent = displayName;
      }
      
      if (dropdownUserRole) {
        dropdownUserRole.textContent = roleDisplayName;
      }
      
      // Toggle dropdown
      userIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        const isVisible = userDropdown.style.display === 'block';
        userDropdown.style.display = isVisible ? 'none' : 'block';
      });
      
      // Cerrar dropdown al hacer clic fuera
      document.addEventListener('click', (e) => {
        if (!userIcon.contains(e.target) && !userDropdown.contains(e.target)) {
          userDropdown.style.display = 'none';
        }
      });
      
      // NOTA: El logout se maneja en userDisplayGlobal.js, no es necesario configurarlo aquí
      // El event listener para logoutBtn ya está configurado en userDisplayGlobal.js
      
      // Manejar ver perfil
      const profileOption = document.getElementById('profileBtn');
      if (profileOption) {
        profileOption.addEventListener('click', (e) => {
          e.preventDefault();
          userDropdown.style.display = 'none';
          
          // Usar el controlador de usuarios para mostrar el perfil
          if (typeof window.showUserProfile === 'function') {
            window.showUserProfile();
          }
        });
      }
    }

    // Hacer disponible globalmente
