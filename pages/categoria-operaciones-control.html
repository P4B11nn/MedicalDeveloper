<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operaciones / Control - Medical Developer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; min-height: 100vh; background: url('../img/medical-background.png?v=1') center center / cover no-repeat; position: relative; overflow-x: hidden; }
    body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(126, 211, 252, 0.1); z-index: -1; }
    header { background: linear-gradient(135deg, #7dd3fc, #fef3c7); color: #1f2937; text-align: center; padding: 20px; position: relative; box-shadow: 0 4px 15px rgba(125, 211, 252, 0.3); }
    header h1 { margin: 0; font-size: 28px; font-weight: bold; }
    header .icon { position: absolute; top: 20px; right: 20px; font-size: 20px; cursor: pointer; }
    .back-btn { position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.2); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; color: #1f2937; transition: all 0.3s ease; }
    .back-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }
    .main-layout { display: flex; min-height: calc(100vh - 68px); }
    .sidebar { width: 280px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-right: 1px solid rgba(125, 211, 252, 0.3); padding: 20px; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1); }
    .sidebar h2 { font-size: 1.5rem; font-weight: 600; background: linear-gradient(135deg, #06b6d4, #0891b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; text-align: center; }
    .sidebar-menu { list-style: none; padding: 0; }
    .sidebar-menu li { margin-bottom: 10px; }
    .sidebar-menu button { width: 100%; padding: 15px 20px; background: rgba(255, 255, 255, 0.8); border: 2px solid rgba(125, 211, 252, 0.3); border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-size: 14px; font-weight: 500; color: #1f2937; text-align: left; display: flex; align-items: center; gap: 10px; }
    .sidebar-menu button:hover, .sidebar-menu button.active { background: linear-gradient(135deg, #06b6d4, #f59e0b); border-color: rgba(125, 211, 252, 0.7); transform: translateX(5px); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25); }
    .content { flex: 1; padding: 30px; background: rgba(255, 255, 255, 0.05); }
    .content-area { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); min-height: calc(100vh - 160px); }
    .content-title { font-size: 2rem; font-weight: 600; background: linear-gradient(135deg, #06b6d4, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 30px; text-align: center; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .control-panel { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-export { background: linear-gradient(135deg, #10b981, #34d399); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease; }
    .btn-export:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .tabla-registros { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
    .tabla-registros th { background: linear-gradient(135deg, #7dd3fc, #fef3c7); color: #1f2937; text-align: left; padding: 15px; font-weight: 600; }
    .tabla-registros td { padding: 12px 15px; border-bottom: 1px solid rgba(125, 211, 252, 0.2); }
    .tabla-registros tr:last-child td { border-bottom: none; }
    .tabla-registros tr:hover { background-color: rgba(125, 211, 252, 0.1); }
    .mesa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 20px 0; }
    .mesa-item { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); border: 2px solid rgba(125, 211, 252, 0.3); border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); text-align: center; }
    .mesa-numero { font-size: 2.5rem; font-weight: 700; background: linear-gradient(135deg, #06b6d4, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 15px; }
    .mesa-status { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin: 10px 0; color: white; }
    .mesa-status.en-servicio { background: linear-gradient(135deg, #10b981, #34d399); }
    .mesa-status.ocupada { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .mesa-status.fuera-servicio { background: linear-gradient(135deg, #ef4444, #f87171); }
    .mesa-info p { margin: 5px 0; color: #374151; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" onclick="window.location.href='../menuInicio.html'" title="Volver al Menú">←</button>
    <div class="icon" id="userIcon">👤 <span id="userName" style="font-weight:bold; margin-left:8px;"></span>
      <div id="userDropdown" style="display:none; position:absolute; top:40px; right:0; background:white; color:#333; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15); min-width:220px; z-index:10;">
        <button id="logoutBtn" style="width:100%; padding:10px; border:none; background:none; cursor:pointer; text-align:left;">Cerrar sesión</button>
      </div>
    </div>
    <h1>Medical Developer - Operaciones / Control</h1>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <h2>Operaciones</h2>
      <ul class="sidebar-menu">
        <li>
          <button data-section="registro-entradas-salidas">
            🚪 Registro de Entradas/Salidas
          </button>
        </li>
        <li>
          <button data-section="mesas-salud">
            📍 Mesas de salud
          </button>
        </li>
      </ul>
    </div>

    <div class="content">
      <div class="content-area">
        <div id="registro-entradas-salidas-section" class="form-section">
          <h2 class="content-title">Registro de Entradas/Salidas</h2>
          <div class="control-panel">
            <input type="text" id="buscarRegistro" placeholder="Buscar por nombre o matrícula..." style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; width: 300px;">
            <select id="filtroRol" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
              <option value="">Todos los roles</option>
              <option value="admin">Administrador</option>
              <option value="practicante">Practicante</option>
            </select>
            <button id="btnExportarTodo" class="btn-export">📥 Exportar a CSV</button>
          </div>
          <div id="registroESLista"></div>
        </div>

        <div id="mesas-salud-section" class="form-section">
          <h2 class="content-title">Estado de las Mesas de Salud</h2>
          <div class="mesa-grid" id="mesasGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { AuthGuard } from '../js/middleware/authGuard.js';
    import { initGlobalController } from '../js/controllers/globalController.js';
    import { initOperationsController } from '../js/controllers/operacionesController.js';
    import '../js/utils/eventBusManager.js';      // Event Bus monitoring
    import '../js/utils/performanceMonitor.js';   // Performance monitoring  
    import '../js/utils/architectureValidator.js'; // Architecture validation
    import '../js/utils/testSuite.js';            // Automated testing
    
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Operaciones: Sistema MVC completo con herramientas de desarrollo');
      
      if (AuthGuard.validateSession()) {
        initGlobalController();
        initOperationsController();
        console.log('✅ Operaciones: Página cargada exitosamente');
        console.log('🔧 Debug: EventBusDebug, PerformanceDebug, ArchitectureDebug, TestSuite');
      }
    });
  </script>
</body>
</html>
