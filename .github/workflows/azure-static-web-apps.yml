name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - v4.1.1
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - v4.1.1

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA optimizations
        run: |
          echo "Optimizing PWA for production..."
          # Verificar que el Service Worker esté actualizado
          if [ -f "sw.js" ]; then
            echo "✓ Service Worker found"
          else
            echo "⚠ Service Worker not found"
          fi
          
          # Verificar manifest.json
          if [ -f "manifest.json" ]; then
            echo "✓ PWA Manifest found"
          else
            echo "⚠ PWA Manifest not found"
          fi
          
          # Verificar archivos críticos
          echo "Checking critical files..."
          ls -la index.html menuInicio.html || echo "Warning: Main HTML files missing"
          ls -la js/ css/ pages/ || echo "Warning: Asset directories missing"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true # Skip build since it's a static PWA

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"