<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - Medical Developer</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .error-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    
    .error-icon {
      font-size: 4rem;
      color: #f43f5e;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 20px;
    }
    
    p {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .back-button {
      background: linear-gradient(135deg, #0ea5e9, #7dd3fc);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .back-button:hover {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">⚠️</div>
    <h1>Oops! Something went wrong</h1>
    <p>We couldn't find the page you were looking for or an unexpected error occurred.</p>
    <a href="index.html" class="back-button" data-route>Back to Home</a>
  </div>
  
  <script type="module" src="../utils/router.js"></script>
</body>
</html>
