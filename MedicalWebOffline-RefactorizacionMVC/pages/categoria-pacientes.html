<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes - Medical Developer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      background: url('../img/medical-background.png?v=1') center center / cover no-repeat;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Overlay para mejorar la legibilidad */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(126, 211, 252, 0.1);
      z-index: -1;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      color: #1f2937;
      text-align: center;
      padding: 20px;
      position: relative;
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.3);
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    header .icon {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      color: #1f2937;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    /* Layout principal */
    .main-layout {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(125, 211, 252, 0.3);
      padding: 20px;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      text-align: center;
    }

    .sidebar-menu {
      list-style: none;
    }

    .sidebar-menu li {
      margin-bottom: 10px;
    }

    .sidebar-menu button {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(125, 211, 252, 0.3);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-menu button:hover,
    .sidebar-menu button.active {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      border-color: rgba(125, 211, 252, 0.5);
      transform: translateX(5px);
    }

    /* Contenido principal */
    .content {
      flex: 1;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
    }

    .content-area {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-height: calc(100vh - 160px);
    }

    .content-title {
      font-size: 2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #06b6d4, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 30px;
      text-align: center;
    }

    .welcome-message {
      text-align: center;
      color: #6b7280;
      font-size: 1.2rem;
      margin-top: 100px;
    }

    /* Formulario de paciente */
    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
      flex: 1;
    }

    .col-md-6 {
      width: 50%;
    }

    .col-md-12 {
      width: 100%;
    }

    .form-group label {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: transparent;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      background: white;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      color: #1f2937;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #38bdf8, #fbbf24);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(125, 211, 252, 0.3);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #6b7280;
      padding: 12px 30px;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
      transform: translateY(-2px);
    }

    /* Tablas de datos */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-container {
      position: relative;
    }

    .search-input {
      padding: 10px 15px;
      padding-left: 40px;
      border: 2px solid #e5e7eb;
      border-radius: 25px;
      font-size: 0.9rem;
      background: white;
      transition: all 0.3s ease;
      width: 250px;
    }

    .search-input:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .search-container::before {
      content: '🔍';
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: #9ca3af;
    }

    .table-responsive {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .data-table th,
    .data-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    .data-table th {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      color: #1f2937;
      font-weight: 600;
    }

    .data-table tbody tr:hover {
      background: rgba(125, 211, 252, 0.05);
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .btn-icon {
      background: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 0 5px;
    }

    .btn-icon:hover {
      background: rgba(125, 211, 252, 0.2);
      transform: translateY(-2px);
    }

    .text-center {
      text-align: center;
    }

    /* Modales */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      position: relative;
      background: white;
      margin: 50px auto;
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(125, 211, 252, 0.4);
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #9ca3af;
      transition: all 0.3s ease;
    }

    .close-modal:hover {
      color: #1f2937;
    }

    .modal-content h3 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal-body {
      margin-bottom: 20px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 20px;
    }

    /* Estilos para timeline */
    .timeline {
      list-style-type: none;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, #7dd3fc, #fef3c7);
      left: 20px;
    }

    .timeline-item {
      margin-bottom: 20px;
      padding-left: 60px;
      position: relative;
    }

    .timeline-date {
      background: linear-gradient(135deg, #7dd3fc, #fef3c7);
      padding: 8px 15px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .timeline-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }

    .timeline-content h5 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .timeline-content p {
      margin: 0 0 15px 0;
      color: #4b5563;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border: 3px solid #7dd3fc;
      border-radius: 50%;
      left: 11px;
      top: 10px;
    }

    /* Estilos para fichas de detalle */
    .patient-info {
      background: rgba(125, 211, 252, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(125, 211, 252, 0.3);
    }

    .detail-card {
      border-radius: 12px;
    }

    .detail-card h4 {
      margin: 20px 0 15px 0;
      font-size: 1.2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 5px;
      border-bottom: 2px solid rgba(125, 211, 252, 0.3);
    }

    .detail-card p {
      margin: 8px 0;
      color: #4b5563;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-success {
      background: #10b981;
      color: white;
    }

    .badge-warning {
      background: #f59e0b;
      color: white;
    }

    .badge-danger {
      background: #ef4444;
      color: white;
    }

    .badge-info {
      background: #3b82f6;
      color: white;
    }

    .badge-secondary {
      background: #6b7280;
      color: white;
    }

    .completed-row {
      background: rgba(16, 185, 129, 0.05);
    }

    .cancelled-row {
      background: rgba(239, 68, 68, 0.05);
    }

    /* Dropdown del usuario */
    #userDropdown {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      background: white;
      color: #333;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      min-width: 180px;
      z-index: 10;
    }

    #userDropdown button {
      width: 100%;
      padding: 10px;
      border: none;
      background: none;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    #userDropdown button:hover {
      background: rgba(125, 211, 252, 0.1);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-layout {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        padding: 15px;
      }
      
      .sidebar-menu {
        display: flex;
        overflow-x: auto;
        gap: 10px;
        padding-bottom: 10px;
      }
      
      .sidebar-menu li {
        margin-bottom: 0;
        min-width: 180px;
      }
      
      .content {
        padding: 20px 15px;
      }
      
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      
      .col-md-6 {
        width: 100%;
      }
      
      .modal-content {
        margin: 20px;
        padding: 20px;
      }
    }

    /* Estilos para el historial médico */
    .historial-filters {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 200px 200px auto;
      gap: 15px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #374151;
    }

    .historial-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #06b6d4;
    }

    .stat-label {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .historial-table {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .historial-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .historial-table th {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
    }

    .historial-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #f1f5f9;
    }

    .historial-table tr:hover {
      background-color: #f8fafc;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.normal { background: #dcfce7; color: #166534; }
    .badge.alerta { background: #fef3c7; color: #92400e; }
    .badge.critico { background: #fecaca; color: #991b1b; }
    .badge.bajo-peso { background: #dbeafe; color: #1e40af; }
    .badge.sobrepeso { background: #fed7aa; color: #9a3412; }
    .badge.obesidad { background: #fecaca; color: #991b1b; }

    .btn-detalle {
      background: #06b6d4;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-detalle:hover {
      background: #0891b2;
    }

    .detail-card {
      margin-bottom: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .modal-body {
      padding: 20px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #e5e7eb;
      text-align: right;
    }

    @media (max-width: 768px) {
      .historial-filters {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      
      .historial-table {
        overflow-x: auto;
      }
      
      .historial-table table {
        min-width: 600px;
      }
    }
  </style>
</head>
<body>
  <header>
  <button class="back-btn" onclick="window.history.back()" title="Volver">←</button>
    <div class="icon" id="userIcon"><span id="userName" style="font-weight:bold; margin-left:8px;"></span>
      <div id="userDropdown">
        <button id="logoutBtn">Cerrar sesión</button>
      </div>
    </div>
    <h1 id="headerTitle">Medical Developer - Pacientes</h1>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <h2>Pacientes</h2>
      <ul class="sidebar-menu">
        <li>
          <button data-section="pacientes-registrados">
            <i class="fas fa-users"></i> Ver pacientes registrados
          </button>
        </li>
        <li>
          <button data-section="nuevo-paciente">
            <i class="fas fa-user-plus"></i> Registro de paciente
          </button>
        </li>
        <li>
          <button data-section="datos-medicos">
            <i class="fas fa-heartbeat"></i> Ingresar datos médicos
          </button>
        </li>
        <li>
          <button data-section="historial-medico">
            <i class="fas fa-chart-line"></i> Historial médico completo
          </button>
        </li>
      </ul>
    </div>

    <div class="content">
      <div class="content-area">
        <!-- Sección por defecto -->
        <div id="default-section">
          <h2 class="content-title">Gestión de Pacientes</h2>
          <div class="welcome-message">
            <p>Selecciona una opción del menú lateral para comenzar</p>
          </div>
        </div>

        <!-- Pacientes registrados -->
        <div id="pacientes-registrados-section" class="form-section"></div>

        <!-- Nuevo paciente -->
        <div id="nuevo-paciente-section" class="form-section"></div>

        <!-- Datos médicos -->
        <div id="datos-medicos-section" class="form-section"></div>

        <!-- Historial médico completo -->
        <div id="historial-medico-section" class="form-section"></div>
      </div>
    </div>
  </div>

  <!-- Modal para ver detalle del historial médico -->
  <div id="modalDetalleHistorial" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 800px; width: 90%;">
      <div class="modal-header">
        <div id="modalHistorialTitulo"></div>
        <span class="close-modal">&times;</span>
      </div>
      <div class="modal-body">
        <div id="modalHistorialContenido"></div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btnCerrarDetalleHistorial" class="btn btn-secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { AuthGuard } from '../js/middleware/authGuard.js';
    import { initGlobalController } from '../js/controllers/globalController.js';
    import { initPacienteController } from '../js/controllers/pacienteController.js';
    import '../js/utils/eventBusManager.js';      // Event Bus monitoring
    import '../js/utils/performanceMonitor.js';   // Performance monitoring
    import '../js/utils/architectureValidator.js'; // Architecture validation
    import '../js/utils/connectionManager.js';     // Connection management
    
    document.addEventListener('DOMContentLoaded', () => {
      if (AuthGuard.validateSession()) {
        initGlobalController();
        initPacienteController();
      }
    });
  </script>
</body>
</html>
